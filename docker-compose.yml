services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: production
      # Provide a key to enable the multimodal LLM path; omit for heuristic mode.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CORS_ORIGINS: http://localhost:8000
      SERVE_FRONTEND: "true"
    restart: unless-stopped
